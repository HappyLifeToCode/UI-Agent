<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCHOLAR AGENT · 审查</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e60012'/%3E%3Ctext x='16' y='23' font-family='Arial Black' font-size='19' font-weight='900' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e60012; --red-dark: #b0000e;
    --ink: #111114; --paper: #f4f2ee; --surface: #ffffff;
    --line: #d8d4cc; --text-2: #6b6560; --ok: #0f7a3d;
    --stripe: repeating-linear-gradient(-45deg, var(--red) 0 14px, transparent 14px 28px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  .display { font-family: "Archivo Black", "Inter", sans-serif; }
  .layout { display: flex; height: 100vh; overflow: hidden; }

  /* 左侧控制面板(黑) */
  .side {
    width: 320px; flex-shrink: 0; background: var(--ink); color: #fff;
    padding: 36px 28px 40px; position: relative; overflow-y: auto;
    display: flex; flex-direction: column; gap: 26px;
  }
  .side::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 10px; background: var(--stripe); }
  .brand .slash {
    display: inline-block; background: var(--red); color: #fff;
    font-size: 12px; font-weight: 700; padding: 4px 12px;
    transform: skew(-12deg); margin-bottom: 14px; letter-spacing: .2em;
  }
  .brand h1 {
    font-family: "Archivo Black", sans-serif; font-size: 34px; line-height: 1.05;
    text-transform: uppercase;
  }
  .brand h1 em { color: var(--red); font-style: normal; }
  .brand p { color: #8b8b90; font-size: 12.5px; margin-top: 12px; line-height: 1.7; }
  .brand a { color: #e8e8ea; font-size: 12.5px; }
  .block-title {
    display: inline-block; background: #fff; color: var(--ink);
    font-weight: 700; font-size: 12px; padding: 5px 14px;
    transform: skew(-12deg); letter-spacing: .12em; margin-bottom: 14px;
  }
  .fbtn {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: #1d1d22; border: 1px solid #33333a; color: #c9c9cf;
    padding: 10px 13px; font-size: 13px; font-family: inherit; margin-bottom: 8px;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
    transition: border-color .15s;
  }
  .fbtn:hover { border-color: var(--red); }
  .fbtn.on { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
  .fbtn .cnt { float: right; opacity: .7; }
  .side-foot { margin-top: auto; font-size: 11px; color: #55555c; line-height: 1.7; }

  /* 右侧内容区(浅) */
  .content { flex: 1; overflow-y: auto; padding: 36px 40px 64px; }
  .page-title {
    font-family: "Archivo Black", sans-serif; font-size: 26px;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .page-sub { color: var(--text-2); font-size: 12.5px; margin-bottom: 22px; }
  .card { background: var(--surface); border: 1px solid var(--line); padding: 8px 0 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: center; padding: 12px 10px; border-bottom: 1px solid #eceae4; vertical-align: middle; }
  th {
    color: var(--text-2); font-weight: 600; font-size: 11px;
    letter-spacing: .12em; text-transform: uppercase; background: #faf9f6;
  }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 3px 12px; font-size: 12px; font-weight: 600; }
  .badge.success { background: #e3f3e9; color: var(--ok); }
  .badge.failed { background: #fbe5e4; color: var(--red); }
  .badge.pending_review { background: #fdf3d8; color: #8a6d00; }
  .review-note { font-size: 11px; color: #999; margin-top: 3px; }
  .mono { font-size: 12px; color: var(--text-2); }
  a.replay { color: var(--red); text-decoration: none; font-weight: 600; white-space: nowrap; }
  a.replay:hover { color: var(--red-dark); }
  .noreplay { color: #bbb; font-size: 12px; }
  .abtn {
    padding: 5px 12px; border: 1px solid var(--line); background: #fff; cursor: pointer;
    font-size: 12px; font-family: inherit; margin: 2px;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
  }
  .abtn:hover { border-color: var(--ink); }
  .abtn.ok { border-color: var(--ok); color: var(--ok); }
  .abtn.rerun { border-color: #1a73e8; color: #1a73e8; }
  .abtn.bad { border-color: var(--red); color: var(--red); }

  /* 审查弹窗 */
  #dlg { position: fixed; inset: 0; background: rgba(17,17,20,.55); display: none; align-items: center; justify-content: center; z-index: 10; }
  #dlg .box { background: var(--surface); border-top: 6px solid var(--red); padding: 26px 26px 20px; width: 480px; }
  #dlg h2 { font-family: "Archivo Black", sans-serif; font-size: 18px; text-transform: uppercase; margin-bottom: 16px; }
  #dlg select, #dlg textarea, #dlg input {
    width: 100%; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; font-family: inherit;
    background: #faf9f6; border: 1px solid var(--line); border-radius: 0; outline: none;
  }
  #dlg select:focus, #dlg textarea:focus, #dlg input:focus { border-color: var(--red); }
  #dlg textarea { height: 84px; resize: vertical; }
  #dlg .submit {
    border: none; cursor: pointer; font-family: "Archivo Black", sans-serif;
    background: var(--red); color: #fff; font-size: 14px; letter-spacing: .14em;
    padding: 12px 26px; text-transform: uppercase;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }
  #dlg .submit:hover { background: var(--red-dark); }
  #dlg .cancel { border: 1px solid var(--line); background: #fff; padding: 12px 18px; cursor: pointer; font-size: 13px; margin-left: 8px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <div class="slash">SCHOLAR</div>
      <h1>Trajectory<br><em>Review</em></h1>
      <p>轨迹数据质检:任务状态总览 → 逐步回放 → 审查定级,结论写入 review.json。</p>
      <p><a href="/">← 返回演示系统</a></p>
    </div>
    <div>
      <div class="block-title">FILTER / 筛选</div>
      <button class="fbtn on" data-f="all">全部<span class="cnt" id="c-all"></span></button>
      <button class="fbtn" data-f="pending_review">待质检<span class="cnt" id="c-pending_review"></span></button>
      <button class="fbtn" data-f="success">成功<span class="cnt" id="c-success"></span></button>
      <button class="fbtn" data-f="failed">失败<span class="cnt" id="c-failed"></span></button>
    </div>
    <div class="side-foot">数据口径 docs/ui_data_interface.md<br>标注格式 docs/review_schema.md</div>
  </aside>

  <main class="content">
    <div class="page-title">任务列表</div>
    <div class="page-sub">状态 = 执行结果 × 审查结论(成功/失败/待质检)</div>
    <div class="card">
      <table>
        <tr><th>任务</th><th>人物</th><th>框架</th><th>模型</th><th>状态</th><th>耗时</th><th>步数</th><th>回放</th><th>审查操作</th></tr>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>

<div id="dlg">
  <div class="box">
    <h2 id="dlg-title">审查</h2>
    <select id="dlg-status">
      <option value="approved">合格（入库）</option>
      <option value="rejected">剔除</option>
      <option value="needs_rerun">返工重跑</option>
    </select>
    <select id="dlg-issue">
      <option value="">问题类型（无问题留空）</option>
      <option value="captcha_screenshot">captcha_screenshot — 截图为验证页</option>
      <option value="fake_not_found">fake_not_found — 假 not_found（额度/加载失败）</option>
      <option value="screenshot_abnormal">screenshot_abnormal — 截图异常</option>
      <option value="content_mismatch">content_mismatch — 内容错误/错配</option>
      <option value="garbled_text">garbled_text — 乱码</option>
      <option value="other">other — 其他</option>
    </select>
    <textarea id="dlg-notes" placeholder="备注 / 问题说明（剔除或返工必填）"></textarea>
    <input id="dlg-reviewer" placeholder="审查人">
    <div>
      <button class="submit" onclick="submitReview()">提交</button>
      <button class="cancel" onclick="document.getElementById('dlg').style.display='none'">取消</button>
    </div>
  </div>
</div>

<script>
let TASKS = [];
let curTask = null;
let filter = 'all';

const STATUS_LABEL = {success:'成功', failed:'失败', pending_review:'待质检'};
const REVIEW_LABEL = {pending:'', approved:'合格', rejected:'已剔除', needs_rerun:'返工中'};

function esc(s){return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function load() {
  const resp = await fetch('/api/review/tasks');
  TASKS = (await resp.json()).tasks;
  render();
}

function render() {
  for (const f of ['all','pending_review','success','failed']) {
    const el = document.getElementById('c-' + f);
    if (el) el.textContent = f === 'all' ? TASKS.length : TASKS.filter(t => t.display_status === f).length;
  }
  const rows = TASKS.filter(t => filter === 'all' || t.display_status === filter);
  document.getElementById('rows').innerHTML = rows.map(t => `<tr>
    <td class="mono">${esc(t.task_id)}</td>
    <td>${esc(t.person_name || '-')}</td>
    <td class="mono">${esc(t.framework || '-')}</td>
    <td class="mono">${esc(t.model || '-')}</td>
    <td><span class="badge ${esc(t.display_status)}">${esc(STATUS_LABEL[t.display_status] || '-')}</span>${REVIEW_LABEL[t.review_status] ? `<div class="review-note">${esc(REVIEW_LABEL[t.review_status])}</div>` : ''}</td>
    <td class="mono">${t.duration_seconds != null ? Math.round(t.duration_seconds/60) + ' min' : '-'}</td>
    <td class="mono">${t.steps ?? '-'}</td>
    <td>${t.has_replay ? `<a class="replay" href="/data/${esc(t.task_id)}/replay.html">回放 ↗</a>` : '<span class="noreplay">未生成</span>'}</td>
    <td><button class="abtn ok" onclick="openDlg('${esc(t.task_id)}','approved')">合格</button><button class="abtn rerun" onclick="openDlg('${esc(t.task_id)}','needs_rerun')">返工</button><button class="abtn bad" onclick="openDlg('${esc(t.task_id)}','rejected')">剔除</button></td>
  </tr>`).join('') || '<tr><td colspan="9" style="color:#999;padding:24px">无匹配任务</td></tr>';
}

function openDlg(taskId, preset) {
  curTask = taskId;
  document.getElementById('dlg-title').textContent = '审查 ' + taskId;
  document.getElementById('dlg-status').value = preset;
  document.getElementById('dlg').style.display = 'flex';
}

async function submitReview() {
  const status = document.getElementById('dlg-status').value;
  const notes = document.getElementById('dlg-notes').value.trim();
  const issueType = document.getElementById('dlg-issue').value;
  const reviewer = document.getElementById('dlg-reviewer').value.trim();
  const issues = issueType ? [{type: issueType, detail: notes, resolved: false}] : [];
  const resp = await fetch('/api/review', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({task_id: curTask, review_status: status, notes, issues, reviewer})
  });
  if (!resp.ok) { alert('提交失败：' + (await resp.json()).detail); return; }
  document.getElementById('dlg').style.display = 'none';
  document.getElementById('dlg-notes').value = '';
  load();
}

document.querySelectorAll('.fbtn').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('.fbtn').forEach(x => x.classList.toggle('on', x === b));
  render();
});

load();
</script>
</body>
</html>
